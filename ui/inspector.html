<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IINfo</title>
<link rel="stylesheet" href="inspector.css" />
</head>
<body>

<div class="toolbar">
  <div class="file-row">
    <span class="fname" id="fname">—</span>
    <span class="chip" id="state">idle</span>
    <span class="chip" id="speed" hidden>1.00×</span>
  </div>
  <div class="controls">
    <div class="seg-group">
      <button class="btn sq" id="b-start" data-icon="start" title="Go to start (Home)"></button>
      <button class="btn sq" id="b-prev" data-icon="stepback" title="Previous frame  ( , )"></button>
      <button class="pp" id="b-pause" data-state="idle" title="Play / Pause  (Space)"></button>
      <button class="btn sq" id="b-next" data-icon="stepfwd" title="Next frame  ( . )"></button>
      <button class="btn sq" id="b-end" data-icon="end" title="Go to end (End)"></button>
    </div>
    <div class="seg-group" id="jump-group">
      <button class="btn mono" data-jump="-10s" title="Back 10 seconds">−10s</button>
      <button class="btn mono" data-jump="-1s" title="Back 1 second">−1s</button>
      <button class="btn mono" data-jump="-10f" title="Back 10 frames">−10f</button>
      <button class="btn mono" data-jump="-5f" title="Back 5 frames">−5f</button>
      <button class="btn mono" data-jump="+5f" title="Forward 5 frames">+5f</button>
      <button class="btn mono" data-jump="+10f" title="Forward 10 frames">+10f</button>
      <button class="btn mono" data-jump="+1s" title="Forward 1 second">+1s</button>
      <button class="btn mono" data-jump="+10s" title="Forward 10 seconds">+10s</button>
    </div>
    <button class="btn sq" id="b-shot" data-icon="camera" title="Exact-frame screenshot  (⌥⇧S)"></button>
    <div class="jump">
      <input id="jump" type="text" spellcheck="false"
        placeholder="01:23:45;12 · #4736 · 50% · +5 · -#15 · 00:00:05;17 + 2"
        title="Go / seek. Absolute: a timecode, #frame, N%, or Ns. Relative to the current point (repeat with Enter): +5 / -5 (seconds), +#15 / -#15 (frames), +2:30, +10%. Or base ± delta: 00:00:05;17 + 5" />
      <button class="btn" id="b-jump">Go</button>
    </div>
    <button class="btn" id="b-gear" data-icon="gear">Settings</button>
    <button class="btn" id="b-copy" data-icon="copy">Report</button>
  </div>
</div>

<div id="drawer"></div>

<div class="essentials">
  <div class="ess-tc" id="ess-tc">
    <span id="ess-tc-val">--:--:--:--</span>
    <span class="ess-acts">
      <button class="mini" data-ess="copy-tc" title="Copy timecode  ( c )">copy</button>
      <button class="mini" data-ess="go-tc" title="Send to the Go field">go ↦</button>
    </span>
  </div>
  <div class="ess-frame" id="ess-frame">
    <span id="ess-frame-val">frame —</span>
    <span class="ess-acts">
      <button class="mini" data-ess="copy-fr" title="Copy frame number  ( ⇧C )">copy</button>
      <button class="mini" data-ess="go-fr" title="Send to the Go field">go ↦</button>
    </span>
  </div>
  <div class="ess-meta" id="ess-meta"></div>
  <div class="scrub" id="scrub" title="Click or drag to seek">
    <div class="scrub-track">
      <div class="scrub-cache" id="scrub-cache"></div>
      <div class="scrub-fill" id="scrub-fill"></div>
      <div class="scrub-head" id="scrub-head"></div>
    </div>
    <div class="scrub-marks" id="scrub-marks"></div>
    <div class="scrub-tip" id="scrub-tip"></div>
  </div>
</div>

<main id="main"></main>

<dialog id="report">
  <textarea id="report-text" readonly></textarea>
  <div style="display:flex; gap:6px; margin-top:9px; justify-content:flex-end">
    <button class="btn" id="report-copy">Copy to clipboard</button>
    <button class="btn" id="report-close">Close</button>
  </div>
</dialog>

<script src="events.js"></script>
<script src="inspector.js"></script>
</body>
</html>
